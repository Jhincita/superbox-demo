<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<svg viewBox="0 8 100 92" width="{{ size }}" height="{{ size }}" style="display:block;overflow:visible">
<g style="stroke-width:3.5;stroke-linejoin:round" stroke="{{ gap }}">
<polygon points="50,30 14,48 50,66 86,48" fill="{{ inner }}"></polygon>
<polygon points="14,48 50,30 42,12 6,30" fill="{{ light }}"></polygon>
<polygon points="50,30 86,48 94,30 58,12" fill="{{ mid }}"></polygon>
<polygon points="14,48 50,66 50,96 14,78" fill="{{ mid }}"></polygon>
<polygon points="50,66 86,48 86,78 50,96" fill="{{ dark }}"></polygon>
<polygon points="14,48 50,66 40,78 4,60" fill="{{ light }}"></polygon>
<polygon points="50,66 86,48 96,60 60,78" fill="{{ light }}"></polygon>
</g>
</svg>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:200},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;},&quot;gap&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#ffffff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;light&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#E8955C&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mid&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#D2733A&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B35C2B&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;inner&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#7E3E1C&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      size: p.size ?? 40, gap: p.gap ?? '#ffffff',
      light: p.light ?? '#E8955C', mid: p.mid ?? '#D2733A', dark: p.dark ?? '#B35C2B', inner: p.inner ?? '#7E3E1C'
    };
  }
}
</script>
</body>
</html>
